name: Generate and publish site

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch:  # Allow manual triggering from GitHub Actions UI
  push:
    branches:
      - main
    paths:
      - 'templates/**'
      - '.github/workflows/publish.yaml'
  workflow_run:
    workflows: ["Run Tests"]
    types:
      - completed
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Site Source
    # Run on: manual trigger, schedule, push to templates, or successful test run
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' || 
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - name: Git checkout
        uses: actions/checkout@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      
      - name: Install dependencies
        run: uv sync
      
      - name: Update KIP data (incremental)
        run: uv run python ipper/main.py kafka update
      
      - name: Download and process FLIP data
        run: uv run python ipper/main.py flink wiki download --update --refresh-days 60
      
      - name: Update FLIP mailing list data (incremental)
        run: uv run python ipper/main.py flink update

      - name: Copy static page to site_files
        run: |
          mkdir site_files
          cp templates/index.html site_files
          cp templates/style.css site_files
          cp -r templates/assets site_files/assets

      - name: Copy skill and API documentation
        run: |
          mkdir -p site_files/skill/ossip
          cp templates/skill/ossip/SKILL.md site_files/skill/ossip/SKILL.md
          cp templates/api.html site_files/api.html 2>/dev/null || true

      - name: Build the Kafka site
        id: kafka-build
        continue-on-error: true
        run: uv run python ipper/main.py kafka output standalone cache/mailbox_files/kip_mentions.csv site_files/kafka.html site_files/kips --api-dir site_files/api/v1/kafka

      - name: Build the Flink site
        id: flink-build
        continue-on-error: true
        run: uv run python ipper/main.py flink output cache/flip_wiki_cache.json site_files/flink.html site_files/flips --api-dir site_files/api/v1/flink

      - name: Generate API index
        run: |
          uv run python -c "
          from ipper.common.api_output import generate_api_index
          from pathlib import Path
          generate_api_index(Path('site_files/api/v1'))
          "

      - name: Check build results
        if: always()
        run: |
          if [ "${{ steps.kafka-build.outcome }}" = "failure" ]; then
            echo "::warning::Kafka build failed — JSON API will not include KIP data"
          fi
          if [ "${{ steps.flink-build.outcome }}" = "failure" ]; then
            echo "::warning::Flink build failed — JSON API will not include FLIP data"
          fi
          if [ "${{ steps.kafka-build.outcome }}" = "failure" ] && [ "${{ steps.flink-build.outcome }}" = "failure" ]; then
            echo "::error::Both Kafka and Flink builds failed"
            exit 1
          fi

      - name: Commit updated cache files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update caches [skip ci]" && git push)
     
      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v4
        with:
          path: site_files

  deploy:
    needs: build
    permissions:
      pages: write    
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

