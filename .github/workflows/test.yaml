name: Run Tests

on:
  pull_request:
    paths:
      - 'ipper/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'pytest.ini'
  push:
    branches:
      - main
    paths:
      - 'ipper/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'pytest.ini'

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Unit Tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      
      # Python comes from .python-version via uv (auto-downloaded & cached)
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      
      - name: Install dependencies
        run: uv sync --locked
      
      - name: Run Ruff linting
        run: uv run ruff check ipper/ tests/
      
      - name: Run Ruff formatting check
        run: uv run ruff format --check ipper/ tests/
      
      - name: Run tests with coverage
        run: uv run pytest
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30
